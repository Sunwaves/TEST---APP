name: Deliver reminders

# Calls the live site every 10 minutes so scheduled reminders go out.
# Needs repository secrets APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET
# (the same value as in the host's environment). Does nothing until both are set.
# Note: GitHub may delay scheduled runs by a few minutes at busy times.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver due messages
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/messages"
